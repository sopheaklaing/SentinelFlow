spring:
  application:
    name: sentinelflow

  datasource:
    url: jdbc:postgresql://localhost:5432/sentinelflow
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

app:
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD}