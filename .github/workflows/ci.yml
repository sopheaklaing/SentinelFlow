
name: SentinelFlow CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop


permissions:
  contents: read
  packages: write


jobs:

  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: sentinelflow
          POSTGRES_USER: sentinelflow
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U sentinelflow -d sentinelflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sentinelflow
          SPRING_DATASOURCE_USERNAME: sentinelflow
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}

          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          JWT_EXPIRATION: 86400000

          APP_BOOTSTRAP_ADMIN_EMAIL: admin@sentinelflow.local
          APP_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD }}

        run: ./mvnw clean test

      - name: SCA - OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

        run: >
          ./mvnw --batch-mode
          org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DfailBuildOnCVSS=7
          -Dformats=HTML,JSON

      - name: Verify SonarQube URL
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

        run: |
          echo "SonarQube URL: ${SONAR_HOST_URL}"

          case "${SONAR_HOST_URL}" in
            http://*|https://*)
              echo "SonarQube URL format is valid."
              ;;
            *)
              echo "Invalid SONAR_HOST_URL"
              exit 1
              ;;
          esac

      - name: SAST - SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

        run: >
          ./mvnw --batch-mode
          sonar:sonar
          -Dsonar.host.url=${SONAR_HOST_URL}
          -Dsonar.token=${SONAR_TOKEN}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/sentinelflow:${{ github.sha }} \
            .
      - name: Container Scan - Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/sentinelflow:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker image to GHCR
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/sentinelflow:${{ github.sha }}

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  deploy:
    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}

          script: |
            set -e

            cd ~/apps/sentinelflow

            STATE_FILE="deployment-state"

            if [ ! -f "$STATE_FILE" ]; then
              echo "ERROR: deployment-state not found."
              exit 1
            fi

            source "$STATE_FILE"

            NEW_SHA="${{ github.sha }}"

            echo "========================================"
            echo "SentinelFlow Deployment"
            echo "========================================"
            echo "Current SHA : ${CURRENT_SHA}"
            echo "Previous SHA: ${PREVIOUS_SHA}"
            echo "New SHA     : ${NEW_SHA}"
            echo "========================================"

            # ----------------------------------------
            # Step 1: Pull new image
            # ----------------------------------------

            export IMAGE_TAG="${NEW_SHA}"

            echo "Pulling new Docker image..."

            docker compose pull sentinelflow-app

            # ----------------------------------------
            # Step 2: Deploy new version
            # ----------------------------------------

            echo "Deploying new version..."

            docker compose up -d --force-recreate sentinelflow-app

            # ----------------------------------------
            # Step 3: Health check
            # ----------------------------------------

            echo "Waiting for application health..."

            HEALTHY=false

            for i in {1..12}; do

              echo "Health check attempt ${i}/12..."

              if curl --fail --silent \
                http://127.0.0.1:8081/api/health \
                > /dev/null; then

                HEALTHY=true
                echo "Application health check PASSED."
                break

              fi

              sleep 5

            done

            # ----------------------------------------
            # Step 4: Success
            # ----------------------------------------

            if [ "$HEALTHY" = true ]; then

              echo "========================================"
              echo "DEPLOYMENT SUCCESS"
              echo "========================================"

              echo "CURRENT_SHA=${NEW_SHA}" > "$STATE_FILE"
              echo "PREVIOUS_SHA=${CURRENT_SHA}" >> "$STATE_FILE"

              echo "Deployment state updated:"
              cat "$STATE_FILE"

              echo "Cleaning unused Docker images..."

              docker image prune -f

              echo "Final container status:"
              docker compose ps

              exit 0

            fi

            # ----------------------------------------
            # Step 5: Automatic Rollback
            # ----------------------------------------

            echo "========================================"
            echo "DEPLOYMENT FAILED"
            echo "Starting automatic rollback..."
            echo "========================================"

            export IMAGE_TAG="${CURRENT_SHA}"

            echo "Rolling back to:"
            echo "${CURRENT_SHA}"

            docker compose pull sentinelflow-app

            docker compose up -d --force-recreate sentinelflow-app

            echo "Waiting for rollback health..."

            ROLLBACK_HEALTHY=false

            for i in {1..12}; do

              echo "Rollback health check attempt ${i}/12..."

              if curl --fail --silent \
                http://127.0.0.1:8081/api/health-test \
                > /dev/null; then

                ROLLBACK_HEALTHY=true
                echo "Rollback health check PASSED."
                break

              fi

              sleep 5

            done

            if [ "$ROLLBACK_HEALTHY" = true ]; then

              echo "========================================"
              echo "ROLLBACK SUCCESS"
              echo "========================================"

              echo "CURRENT_SHA=${CURRENT_SHA}" > "$STATE_FILE"
              echo "PREVIOUS_SHA=${PREVIOUS_SHA}" >> "$STATE_FILE"

              echo "Restored deployment state:"
              cat "$STATE_FILE"

              docker compose ps

              exit 1

            fi

            echo "========================================"
            echo "CRITICAL: ROLLBACK FAILED"
            echo "========================================"

            docker compose ps
            docker compose logs --tail=100 sentinelflow-app

            exit 1