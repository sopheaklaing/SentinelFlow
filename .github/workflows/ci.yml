name: SentinelFlow CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: sentinelflow-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ==========================================================
  # 1. BUILD & TEST
  # ==========================================================

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: sentinelflow
          POSTGRES_USER: sentinelflow
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U sentinelflow -d sentinelflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sentinelflow
          SPRING_DATASOURCE_USERNAME: sentinelflow
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}

          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          JWT_EXPIRATION: 86400000

          APP_BOOTSTRAP_ADMIN_EMAIL: admin@sentinelflow.local
          APP_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD }}

        run: ./mvnw --batch-mode clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/


  # ==========================================================
  # 2. SECURITY ANALYSIS
  # ==========================================================

  security:
    name: Security Analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

        run: >
          ./mvnw --batch-mode
          org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DfailBuildOnCVSS=7
          -Dformats=HTML,JSON

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json

      - name: Verify SonarQube URL
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

        run: |
          case "${SONAR_HOST_URL}" in
            http://*|https://*)
              ;;
            *)
              echo "Invalid SONAR_HOST_URL"
              exit 1
              ;;
          esac

      - name: SonarQube SAST
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

        run: >
          ./mvnw --batch-mode
          sonar:sonar
          -Dsonar.host.url=${SONAR_HOST_URL}
          -Dsonar.token=${SONAR_TOKEN}


  # ==========================================================
  # 3. SBOM
  # ==========================================================

  sbom:
    name: Generate SBOM
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sentinelflow-sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sentinelflow-sbom
          path: sentinelflow-sbom.json


  # ==========================================================
  # 4. DOCKER BUILD & CONTAINER SECURITY
  # ==========================================================

  docker-security:
    name: Docker Build & Trivy
    needs:
      - security
      - sbom

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/sentinelflow:${{ github.sha }} \
            .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/sentinelflow:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/sentinelflow:${{ github.sha }}


  # ==========================================================
  # 5. OWASP ZAP - DAST
  # ==========================================================

  zap:
    name: OWASP ZAP DAST
    needs: docker-security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name sentinelflow-postgres-zap \
            -e POSTGRES_DB=sentinelflow \
            -e POSTGRES_USER=sentinelflow \
            -e POSTGRES_PASSWORD="${{ secrets.CI_POSTGRES_PASSWORD }}" \
            -p 5433:5432 \
            postgres:17-alpine

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec sentinelflow-postgres-zap \
              pg_isready -U sentinelflow -d sentinelflow; then
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Pull SentinelFlow image
        run: |
          docker pull \
            ghcr.io/${{ github.repository_owner }}/sentinelflow:${{ github.sha }}

      - name: Start SentinelFlow
        run: |
          docker run -d \
            --name sentinelflow-zap \
            --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5433/sentinelflow \
            -e SPRING_DATASOURCE_USERNAME=sentinelflow \
            -e SPRING_DATASOURCE_PASSWORD="${{ secrets.CI_POSTGRES_PASSWORD }}" \
            -e JWT_SECRET="${{ secrets.CI_JWT_SECRET }}" \
            -e JWT_EXPIRATION=86400000 \
            -e APP_BOOTSTRAP_ADMIN_EMAIL=admin@sentinelflow.local \
            -e APP_BOOTSTRAP_ADMIN_PASSWORD="${{ secrets.CI_ADMIN_PASSWORD }}" \
            ghcr.io/${{ github.repository_owner }}/sentinelflow:${{ github.sha }}

      - name: Wait for SentinelFlow
        run: |
          for i in {1..30}; do

            if curl --fail --silent \
              http://127.0.0.1:8080/api/health \
              > /dev/null; then

              exit 0

            fi

            sleep 3

          done

          docker logs sentinelflow-zap
          exit 1

      - name: OWASP ZAP Baseline Scan
        run: |
          mkdir -p zap-report

          docker run --network host \
            -v "${{ github.workspace }}/zap-report:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8080 \
            -r zap-report.html \
            -J zap-report.json \
            -I

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report/

      - name: Cleanup ZAP environment
        if: always()
        run: |
          docker rm -f sentinelflow-zap || true
          docker rm -f sentinelflow-postgres-zap || true


  # ==========================================================
  # 6. DEPLOY TO PRODUCTION
  # ==========================================================

  deploy:
    name: Deploy to VPS
    needs: zap

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: sentinelflow-production
      cancel-in-progress: false

    steps:

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}

          script: |

            set -e

            cd ~/apps/sentinelflow

            STATE_FILE="deployment-state"

            if [ ! -f "$STATE_FILE" ]; then
              exit 1
            fi

            source "$STATE_FILE"

            NEW_SHA="${{ github.sha }}"

            export IMAGE_TAG="${NEW_SHA}"

            docker compose pull sentinelflow-app

            docker compose up -d --force-recreate sentinelflow-app

            HEALTHY=false

            for i in {1..12}; do

              if curl --fail --silent \
                http://127.0.0.1:8081/api/health \
                > /dev/null; then

                HEALTHY=true
                break

              fi

              sleep 5

            done

            if [ "$HEALTHY" = true ]; then

              echo "CURRENT_SHA=${NEW_SHA}" > "$STATE_FILE"
              echo "PREVIOUS_SHA=${CURRENT_SHA}" >> "$STATE_FILE"

              docker compose ps

              exit 0

            fi

            export IMAGE_TAG="${CURRENT_SHA}"

            docker compose pull sentinelflow-app

            docker compose up -d --force-recreate sentinelflow-app

            ROLLBACK_HEALTHY=false

            for i in {1..12}; do

              if curl --fail --silent \
                http://127.0.0.1:8081/api/health \
                > /dev/null; then

                ROLLBACK_HEALTHY=true
                break

              fi

              sleep 5

            done

            if [ "$ROLLBACK_HEALTHY" = true ]; then

              echo "CURRENT_SHA=${CURRENT_SHA}" > "$STATE_FILE"
              echo "PREVIOUS_SHA=${PREVIOUS_SHA}" >> "$STATE_FILE"

              docker compose ps

              exit 1

            fi

            docker compose ps
            docker compose logs --tail=100 sentinelflow-app

            exit 1